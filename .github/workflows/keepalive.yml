
name: SMS Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env: 
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          curl --fail --silent --show-error \
                --max-time 90 \
                --retry 3 --retry-delay 15 \
                "$APP_URL/api/health"


